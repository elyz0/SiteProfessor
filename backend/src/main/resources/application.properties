# Database
spring.datasource.url=jdbc:mysql://localhost:3306/siteprofessor?useSSL=false&serverTimezone=UTC
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Charset
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# JWT (lembrar de ajustar isso aqui depois)
app.jwt.secret=chave_super_secreta
app.jwt.expiration=7200000

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=SEU_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=SEU_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email
